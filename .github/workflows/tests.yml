name: Проверки Sangens
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  tests:
    if: github.event_name != 'schedule'
    name: Проверки Python и JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Установить зависимости проверок
        run: python -m pip install -r requirements-test.txt
      - name: Проверить интеграцию
        run: python -m pytest -q
      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Установить зависимости карточки
        run: npm ci
      - name: Проверить карточку
        run: npm test

  hacs:
    name: Проверка HACS
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Проверить совместимость с HACS
        uses: hacs/action@main
        with:
          category: integration
  hassfest:
    name: Проверка hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Проверить интеграцию Home Assistant
        uses: home-assistant/actions/hassfest@master

  helper:
    name: Проверка помощника macOS
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Проверить состояние помощника
        run: |
          swiftc -module-cache-path .swift-module-cache tools/sangens-setup/VerificationState.swift tools/sangens-setup/state-tests.swift -o /tmp/sangens-state-tests
          /tmp/sangens-state-tests
      - name: Собрать приложение
        run: python3 tools/sangens-setup/build.py /tmp/sangens-helper
