# https://github.com/hacs/action
name: Проверка HACS

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  hacs:
    name: Проверка HACS
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v2"
      - name: Проверка HACS
        uses: "hacs/action@main"
        with:
          category: "integration"